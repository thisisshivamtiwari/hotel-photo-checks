[project]
name = "hotel-photo-checks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shivam Tiwari" }
]
requires-python = ">=3.12"
dependencies = [
    "imagehash>=4.3.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "pyyaml>=6.0.4",
]

[project.optional-dependencies]
clip = [
    "open-clip-torch>=4.2.2",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv.build-backend]
module-name = "photo_checks"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/photo_checks/readme.py" = ["E501"]  # markdown table rows
